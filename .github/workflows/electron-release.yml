name: Release Windows App

on:
  push:
    tags:
      - 'v*' # Sadece v ile başlayan etiketlerde (örn: v1.0.0) çalışır
  workflow_dispatch: # Manuel tetikleme seçeneği

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write # GitHub Release oluşturmak için gerekli izin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (React/Vite)
        run: npm run build

      - name: Build & Publish Electron App
        # Bu komut package.json'daki "electron-builder" scriptini tetikleyecektir
        # electron-builder otomatik olarak GitHub Release oluşturur
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
